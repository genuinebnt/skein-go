syntax = "proto3";

// Text and code search, the link graph and its algorithms, and reading plans
// (ADR-0010, ADR-0011). Every result is limited to notes the subject can read.
package skein.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "skein/v1/common.proto";

option go_package = "github.com/genuinebnt/skein-go/gen/go/skein/v1;skeinv1";

// REST routes are listed in docs/api/search.md.
service SearchService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Search"
    description: "Text, regular-expression and code search; title completion."
  };

  // Searches block text in one workspace.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/search"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Search a workspace"
      description:
        "Text mode is typo-tolerant word and phrase search. Regex mode runs "
        "an RE2 regular expression over block text, using the trigram index "
        "to pick candidate blocks; candidates and matched in the response "
        "show how selective the index was."
      tags: "Search"
    };
  }
  // Typo-tolerant title completion for the command palette and [[links]].
  rpc SuggestTitles(SuggestTitlesRequest) returns (SuggestTitlesResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/title-suggestions"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Suggest note titles"
      tags: "Search"
    };
  }
}

// REST routes are listed in docs/api/graph.md.
service GraphService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Graph"
    description: "The note link graph, graph algorithms and reading plans."
  };

  rpc GetLinkGraph(GetLinkGraphRequest) returns (GetLinkGraphResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/graph"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the link graph"
      tags: "Graph"
    };
  }
  // Algorithms that need no parameter, over the whole readable graph.
  rpc AnalyzeGraph(AnalyzeGraphRequest) returns (AnalyzeGraphResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/graph/analysis"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Analyze the link graph"
      tags: "Graph"
    };
  }
  // The notes within reach of a note, by hop, in the requested direction.
  // By default the direction is BLAST_DIRECTION_CITED_BY: the notes that
  // link to this one, directly or transitively, which are the notes affected
  // if this one changes.
  rpc BlastRadius(BlastRadiusRequest) returns (BlastRadiusResponse) {
    option (google.api.http) = {get: "/v1/notes/{note_id}/blast-radius"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a note's blast radius"
      tags: "Graph"
    };
  }
  // The cheapest path between two notes under a metric.
  rpc ShortestPath(ShortestPathRequest) returns (ShortestPathResponse) {
    option (google.api.http) = {get: "/v1/notes/{from}/shortest-path/{to}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Find the shortest path between two notes"
      tags: "Graph"
    };
  }
  // What to read before a note, in order.
  rpc ReadingPath(ReadingPathRequest) returns (ReadingPathResponse) {
    option (google.api.http) = {get: "/v1/notes/{note_id}/reading-path"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the reading path to a note"
      tags: "Graph"
    };
  }
  // The best set of notes on a topic for a time budget, respecting
  // prerequisites (a knapsack solved by dynamic programming).
  rpc ReadingPlan(ReadingPlanRequest) returns (ReadingPlanResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/reading-plan"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Plan reading on a topic within a time budget"
      tags: "Graph"
    };
  }
}

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  // Words and phrases, typo-tolerant.
  SEARCH_MODE_TEXT = 1;
  // Regular expression over block text, accelerated by the trigram index.
  SEARCH_MODE_REGEX = 2;
}

message SearchRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Words in text mode; an RE2 expression in regex mode.
  string query = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"func \\\\w+\\\\(ctx context\\\\.Context\""}
  ];
  // Unspecified means SEARCH_MODE_TEXT.
  SearchMode mode = 3;
  bool case_sensitive = 4;
  bool whole_word = 5;
  // Only code blocks in these languages, for example "go" or "rust".
  repeated string languages = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "[\"go\", \"rust\"]"}];
  // Only code blocks, in any language.
  bool code_only = 7;
  PageRequest page = 8;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  PageResponse page = 2;
  // How many blocks the trigram index proposed and how many matched, so the
  // index's selectivity is visible.
  uint32 candidates = 3;
  uint32 matched = 4;
}
message SearchHit {
  BlockRef location = 1;
  string note_title = 2;
  string snippet = 3;
  // Match ranges inside snippet, in code points.
  repeated Range highlights = 4;
  double score = 5;
  string language = 6;
}
message Range {
  uint32 start = 1;
  uint32 end = 2;
}
message SuggestTitlesRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  // What the user has typed so far; may contain typos.
  string prefix = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"raft lgo\""}
  ];
  // Maximum suggestions. 0 means the server default.
  uint32 limit = 3;
}
message SuggestTitlesResponse {
  repeated TitleSuggestion suggestions = 1;
}
message TitleSuggestion {
  string note_id = 1;
  string title = 2;
  // Edit distance between the typed prefix and the title; 0 is an exact
  // prefix match.
  uint32 edit_distance = 3;
}

message GraphNode {
  string note_id = 1;
  string title = 2;
  // A designated entry point of the workspace. Components that contain no
  // root are reported as orphans by AnalyzeGraph.
  bool is_root = 3;
}

// A link: the note `from` contains a [[link]] to the note `to`.
message GraphEdge {
  string from = 1;
  string to = 2;
}
message GetLinkGraphRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message GetLinkGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}
message AnalyzeGraphRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message AnalyzeGraphResponse {
  // Connected component of each note, ignoring link direction.
  map<string, uint32> component_of = 1;
  // Components that contain no root note.
  repeated uint32 orphan_components = 2;
  // Strongly connected component of each note, following link direction.
  // Numbered so the component holding the smallest note ID is 0.
  map<string, uint32> scc_of = 3;
  repeated uint32 scc_sizes = 4;
  // One example cycle, first equals last; empty if the graph is acyclic.
  repeated string cycle = 5;
  // A reading order where no note comes before one it links to. Partial when
  // the graph has cycles; the rest is in unplaced.
  repeated string topological_order = 6;
  repeated string unplaced = 7;
  map<string, double> betweenness = 8;
  map<string, double> pagerank = 9;
  // Louvain communities and the modularity of that partition.
  map<string, uint32> community_of = 10;
  double modularity = 11;
  uint32 diameter = 12;
}

// Which links a blast radius follows.
enum BlastDirection {
  // Treated as BLAST_DIRECTION_CITED_BY.
  BLAST_DIRECTION_UNSPECIFIED = 0;
  // Follow links backwards, to the notes that link to the source: "if this
  // note changes, these notes are affected".
  BLAST_DIRECTION_CITED_BY = 1;
  // Follow links forwards, to the notes the source links to: "this note
  // depends on these".
  BLAST_DIRECTION_CITES = 2;
}
message BlastRadiusRequest {
  string note_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 0 means no limit.
  uint32 max_hops = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "3"}];
  // Unspecified means BLAST_DIRECTION_CITED_BY.
  BlastDirection direction = 3;
}
message BlastRadiusResponse {
  // Notes reached, with their hop distance from the source; the source
  // itself is included at distance 0.
  map<string, uint32> hops = 1;
  // Number of notes at each distance; ring_sizes[0] is the source itself.
  repeated uint32 ring_sizes = 2;
}
enum PathMetric {
  PATH_METRIC_UNSPECIFIED = 0;
  // Link hops, ignoring direction.
  PATH_METRIC_HOPS = 1;
  // Sum of (1 - cosine similarity) along links.
  PATH_METRIC_SEMANTIC = 2;
}
message ShortestPathRequest {
  // Note ID where the path starts.
  string from = 1 [(google.api.field_behavior) = REQUIRED];
  // Note ID where the path ends.
  string to = 2 [(google.api.field_behavior) = REQUIRED];
  // Unspecified means PATH_METRIC_HOPS.
  PathMetric metric = 3;
}
message ShortestPathResponse {
  // False when no path exists; path is then empty.
  bool found = 1;
  // Note IDs from `from` to `to`, both included.
  repeated string path = 2;
  // Total cost under the requested metric.
  double cost = 3;
}
message ReadingPathRequest {
  string note_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReadingPathResponse {
  repeated ReadingStep steps = 1;
}
message ReadingStep {
  string note_id = 1;
  // Why this note is in the path, for example "linked from X".
  string reason = 2;
  uint32 depth = 3;
}
message ReadingPlanRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Free text matched semantically against notes.
  string topic = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"consensus protocols\""}
  ];
  // The time budget, in minutes of estimated reading time.
  uint32 minutes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "45"}
  ];
}
message ReadingPlanResponse {
  repeated PlannedNote notes = 1;
  uint32 total_minutes = 2;
  double total_value = 3;
}
message PlannedNote {
  string note_id = 1;
  uint32 minutes = 2;
  double value = 3;
  string reason = 4;
}
