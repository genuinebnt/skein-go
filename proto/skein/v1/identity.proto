syntax = "proto3";

// Users, sessions, workspaces, roles and authorization (ADR-0008).
package skein.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "skein/v1/common.proto";

option go_package = "github.com/genuinebnt/skein-go/gen/go/skein/v1;skeinv1";

// REST routes: every user-facing RPC has a google.api.http mapping served by
// the gateway (docs/api/identity.md). Authorize, ListReadableNotes and
// IssueDelegatedToken are internal: only other services call them, so they
// have no HTTP mapping and the gateway never routes to them.
service IdentityService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Identity"
    description: "Accounts, sessions, workspaces, members, note roles and share links."
  };

  // Sign up
  //
  // Creates an account with email and password and signs it in.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Identity"
      security: {}
    };
  }
  // Sign in with a password
  //
  // Signs in with email and password.
  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = {
      post: "/v1/sessions"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Identity"
      security: {}
    };
  }
  // Sign in with OAuth
  //
  // Exchanges an OAuth authorization code (Google, GitHub) for a session.
  rpc SignInWithOAuth(SignInWithOAuthRequest) returns (SignInWithOAuthResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:oauth"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Identity"
      security: {}
    };
  }
  // Refresh a session
  //
  // Rotates the refresh token and issues a new access token. The old refresh
  // token stops working; presenting an already-rotated one is treated as
  // theft and revokes the session.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Identity"
      security: {}
    };
  }
  // Sign out
  //
  // Revokes the session that owns the refresh token. The refresh token is
  // the credential, so an expired access token does not prevent signing out.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:signOut"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Identity"
      security: {}
    };
  }
  // Get a user
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }

  // Create a workspace
  //
  // Creates a workspace owned by the caller.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // List workspace members
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/members"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // Set a member's workspace role
  //
  // Adds a member with a role, or changes an existing member's role.
  rpc SetWorkspaceRole(SetWorkspaceRoleRequest) returns (SetWorkspaceRoleResponse) {
    option (google.api.http) = {
      put: "/v1/workspaces/{workspace_id}/members/{user_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // Remove a workspace member
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/members/{user_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // Set a user's role on a note
  //
  // Sets or clears a per-note role override for one user.
  rpc SetNoteRole(SetNoteRoleRequest) returns (SetNoteRoleResponse) {
    option (google.api.http) = {
      put: "/v1/notes/{note_id}/roles/{user_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // Create a share link
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse) {
    option (google.api.http) = {
      post: "/v1/notes/{note_id}/share-links"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
  // Revoke a share link
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse) {
    option (google.api.http) = {delete: "/v1/share-links/{link_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }

  // Internal. Checks many (action, resource) pairs for one subject in one
  // call. Every service calls this, with a short cache, before acting.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  // Internal. Lists the notes a subject can read in a workspace, for
  // permission-aware search (ADR-0010).
  rpc ListReadableNotes(ListReadableNotesRequest) returns (ListReadableNotesResponse);
  // Internal. Issues a short-lived token for an agent run acting as the user
  // (ADR-0009). Only the agent service may call it.
  rpc IssueDelegatedToken(IssueDelegatedTokenRequest) returns (IssueDelegatedTokenResponse);
  // Register a CRDT replica
  //
  // Records that a CRDT replica ID belongs to the calling user (ADR-0004).
  // Browser-facing: each device mints its replica ID in IndexedDB and
  // registers it before its first sync. Documents accepts operations from a
  // replica only on connections authenticated as the user who registered it,
  // so blame cannot be forged. Registering an ID the caller already owns
  // succeeds; one owned by someone else fails with ALREADY_EXISTS and the
  // client must mint a new ID.
  rpc RegisterReplica(RegisterReplicaRequest) returns (RegisterReplicaResponse) {
    option (google.api.http) = {
      post: "/v1/replicas"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Identity"};
  }
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_GUEST = 1;
  WORKSPACE_ROLE_MEMBER = 2;
  WORKSPACE_ROLE_ADMIN = 3;
  WORKSPACE_ROLE_OWNER = 4;
}

enum NoteRole {
  NOTE_ROLE_UNSPECIFIED = 0;
  NOTE_ROLE_VIEWER = 1;
  NOTE_ROLE_COMMENTER = 2;
  NOTE_ROLE_EDITOR = 3;
}

// Every action a subject can attempt. Services authorize with these values,
// never with free-form strings.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_NOTE_READ = 1;
  ACTION_NOTE_COMMENT = 2;
  ACTION_NOTE_EDIT = 3;
  ACTION_NOTE_CREATE = 4;
  ACTION_NOTE_DELETE = 5;
  ACTION_NOTE_SHARE = 6;
  ACTION_WORKSPACE_MANAGE_MEMBERS = 7;
  ACTION_WORKSPACE_MANAGE_SETTINGS = 8;
  ACTION_AGENT_RUN = 9;
}

enum OAuthProvider {
  O_AUTH_PROVIDER_UNSPECIFIED = 0;
  O_AUTH_PROVIDER_GOOGLE = 1;
  O_AUTH_PROVIDER_GITHUB = 2;
}

message User {
  // UUIDv7.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"01936f3e-8c4a-7b2e-9f10-3d5a6b7c8d90\""}
  ];
  string email = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"ada@example.com\""}];
  string display_name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Ada Lovelace\""}];
  google.protobuf.Timestamp created_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A signed-in session. Send access_token as `Authorization: Bearer <token>`;
// keep refresh_token secret and use it only with Refresh and SignOut.
message Session {
  // Short-lived signed token (minutes).
  string access_token = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"eyJhbGciOiJFZERTQSJ9.eyJzdWIiOiIwMTkzNmYzZSJ9.c2lnbmF0dXJl\""}];
  google.protobuf.Timestamp access_expires_at = 2;
  // Opaque rotating token (days). Each refresh returns a new one.
  string refresh_token = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"rt_9mQ2xV7kLp3sT8wZ\""}];
  google.protobuf.Timestamp refresh_expires_at = 4;
}

// Who is acting: a user, or an agent run acting for a user.
message Subject {
  string user_id = 1;
  // Set when an agent run acts for user_id.
  string agent_run_id = 2;
}

message Member {
  User user = 1;
  WorkspaceRole role = 2;
}

message SignUpRequest {
  string email = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"ada@example.com\""}
  ];
  // Stored only as an Argon2id hash and never logged (ADR-0008). Identity
  // rejects weak passwords with INVALID_ARGUMENT.
  string password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Ada Lovelace\""}
  ];
}
message SignUpResponse {
  User user = 1;
  Session session = 2;
}
message SignInRequest {
  string email = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"ada@example.com\""}
  ];
  string password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
}
message SignInResponse {
  User user = 1;
  Session session = 2;
}
message SignInWithOAuthRequest {
  OAuthProvider provider = 1 [(google.api.field_behavior) = REQUIRED];
  // The authorization code the provider returned to redirect_uri.
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  // The PKCE verifier whose challenge started the flow.
  string code_verifier = 3 [(google.api.field_behavior) = REQUIRED];
  // Must equal the redirect URI used to start the flow.
  string redirect_uri = 4 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"https://skein.example.com/auth/callback\""}
  ];
}
message SignInWithOAuthResponse {
  User user = 1;
  Session session = 2;
  // True when this sign-in created the account.
  bool created = 3;
}
message RefreshRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}
message RefreshResponse {
  Session session = 1;
}
message SignOutRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}
message SignOutResponse {}
message GetUserRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message GetUserResponse {
  User user = 1;
}
message CreateWorkspaceRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Research\""}
  ];
}
message CreateWorkspaceResponse {
  // UUIDv7.
  string workspace_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"01936f3e-1a2b-7c3d-8e4f-5a6b7c8d9e0f\""}];
}
message ListMembersRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  PageRequest page = 2;
}
message ListMembersResponse {
  repeated Member members = 1;
  PageResponse page = 2;
}
message SetWorkspaceRoleRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
  // WORKSPACE_ROLE_UNSPECIFIED is rejected; use RemoveMember to remove.
  WorkspaceRole role = 3 [(google.api.field_behavior) = REQUIRED];
}
message SetWorkspaceRoleResponse {}
message RemoveMemberRequest {
  string workspace_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
}
message RemoveMemberResponse {}
message SetNoteRoleRequest {
  string note_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
  // NOTE_ROLE_UNSPECIFIED removes the override and falls back to the
  // workspace role.
  NoteRole role = 3;
}
message SetNoteRoleResponse {}
message CreateShareLinkRequest {
  string note_id = 1 [(google.api.field_behavior) = REQUIRED];
  NoteRole role = 2 [(google.api.field_behavior) = REQUIRED];
  // When the link stops working. Unset means it never expires.
  google.protobuf.Timestamp expires_at = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"2026-12-01T00:00:00Z\""}];
}
message CreateShareLinkResponse {
  string link_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"01936f70-4d5e-7f60-8a71-8c9d0e1f2031\""}];
  // Returned once; only a hash is stored.
  string token = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"sl_Vb4nR8tYq2Kd6Hj1\""}];
}
message RevokeShareLinkRequest {
  string link_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message RevokeShareLinkResponse {}

message AuthorizeRequest {
  Subject subject = 1;
  repeated Check checks = 2;
}
message Check {
  Action action = 1;
  // A note ID or a workspace ID, depending on the action.
  string resource_id = 2;
}
message AuthorizeResponse {
  // One entry per check, in the same order.
  repeated bool allowed = 1;
}
message ListReadableNotesRequest {
  Subject subject = 1;
  string workspace_id = 2;
}
message ListReadableNotesResponse {
  repeated string note_ids = 1;
}
message IssueDelegatedTokenRequest {
  string user_id = 1;
  string agent_run_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message IssueDelegatedTokenResponse {
  string access_token = 1;
}
message RegisterReplicaRequest {
  // Random 64-bit ID minted by the device. A JSON string, because uint64
  // does not fit a JavaScript number.
  uint64 replica_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"4831727201934127107\""}
  ];
}
message RegisterReplicaResponse {}
