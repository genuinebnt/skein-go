syntax = "proto3";

// Inbox, live push and notification preferences.
package skein.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "skein/v1/common.proto";

option go_package = "github.com/genuinebnt/skein-go/gen/go/skein/v1;skeinv1";

// REST routes are listed in docs/api/notifications.md. Every route acts on
// the caller's own inbox and preferences, so none takes a user ID. Subscribe
// streams, so the gateway serves it as the WebSocket /v1/notifications/live
// (docs/api/websocket.md) and it has no HTTP mapping here.
service NotificationService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Notifications"
    description: "The caller's inbox and notification preferences."
  };

  // List the inbox
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse) {
    option (google.api.http) = {get: "/v1/notifications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Notifications"};
  }
  // Mark notifications as read
  //
  // Marks notifications as read. IDs that are already read, or unknown, are
  // ignored, so the call is idempotent.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {
    option (google.api.http) = {
      post: "/v1/notifications:markRead"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Notifications"};
  }
  // Live notifications for the caller, relayed to the browser by the gateway.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  // Get notification preferences
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse) {
    option (google.api.http) = {get: "/v1/notification-preferences"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Notifications"};
  }
  // Update notification preferences
  //
  // Replaces the preferences for the kinds listed; kinds not listed keep their
  // current setting.
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse) {
    option (google.api.http) = {
      put: "/v1/notification-preferences"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Notifications"};
  }
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_MENTION = 1;
  NOTIFICATION_KIND_COMMENT = 2;
  NOTIFICATION_KIND_SHARE = 3;
  NOTIFICATION_KIND_AGENT_RUN_FINISHED = 4;
  NOTIFICATION_KIND_ACCESS_CHANGED = 5;
}

message Notification {
  string id = 1;
  NotificationKind kind = 2;
  string title = 3;
  string body = 4;
  BlockRef location = 5;
  string actor_id = 6;
  google.protobuf.Timestamp created_at = 7;
  bool read = 8;
}
message ListInboxRequest {
  PageRequest page = 1;
  // Only notifications not yet marked read.
  bool unread_only = 2;
}
message ListInboxResponse {
  repeated Notification notifications = 1;
  PageResponse page = 2;
  // Total unread notifications in the inbox, for the badge.
  uint32 unread = 3;
}
message MarkReadRequest {
  repeated string ids = 1 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "[\"01936f60-5e6f-7a80-9b92-0d1e2f304152\"]"}
  ];
}
message MarkReadResponse {}
message SubscribeRequest {}
message SubscribeResponse {
  Notification notification = 1;
}
message Preference {
  NotificationKind kind = 1;
  // Show in the inbox and push live.
  bool in_app = 2;
  // Also send an email.
  bool email = 3;
}
message GetPreferencesRequest {}
message GetPreferencesResponse {
  repeated Preference preferences = 1;
}
message UpdatePreferencesRequest {
  repeated Preference preferences = 1;
}
message UpdatePreferencesResponse {}
