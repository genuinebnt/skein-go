name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
      - run: make fmt-check vet
      - run: make test
      - run: make wasm-check
      - name: Fuzz smoke test
        run: make fuzz FUZZTIME=15s

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The same pinned versions as the Makefile, so regeneration is exact.
      - run: make proto-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint, format and breaking changes
        run: make proto-check PROTO_BASE=origin/${{ github.base_ref || 'main' }}
      - name: Generated code matches the contracts
        run: make proto-stale
      - name: Python bindings install and import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -e 'gen/python[test]'
          /tmp/venv/bin/pytest gen/python

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: sh -n deploy/compose/pubsub-init.sh

  # The two Python services' unit tests (docs/testing.md). ml installs with
  # pip from its pyproject, as its README says, with the bench extra so the
  # reference-library oracle tests run instead of skipping; the loopback
  # marker adds the real gRPC server on 127.0.0.1.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev,bench,redis,postgres,pubsub]'
      - run: .venv/bin/pytest
      - run: .venv/bin/pytest -m loopback

  # The agent is locked (uv.lock); --frozen fails if the lock is stale.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - run: uv sync --frozen --extra postgres --extra dev
      - run: uv run --frozen python -m pytest

  # Lint and format for both Python services, each with its own pyproject
  # settings. Pinned to the version in services/agent/uv.lock so a new ruff
  # release cannot fail CI on unchanged code.
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUFF_VERSION: "0.17.5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx "ruff@$RUFF_VERSION" check services/ml services/agent
      - run: uvx "ruff@$RUFF_VERSION" format --check services/ml services/agent

  # The browser client: the Go WebAssembly bridge (its tests and the module
  # the app loads), then typecheck, lint, Vitest and the live-mode build.
  # Standard Go builds the module here; TinyGo is the production compiler
  # (web/wasm/build.sh) and is not installed on the runner.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      SKEIN_WASM_COMPILER: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
          cache-dependency-path: web/wasm/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: WebAssembly bridge tests
        working-directory: web/wasm
        run: go test -count=1 ./...
      - run: pnpm install --frozen-lockfile
      - name: WebAssembly bridge build
        run: pnpm wasm
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Seed data is deterministic (docs/seed-data.md): regenerating the small
  # profile must reproduce the committed testdata/seed/small byte for byte,
  # and the medium profile must stay inside its time budget.
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make seed-small
      - name: Regenerated seed matches the committed copy
        run: |
          git add -N testdata/seed/small
          git diff --exit-code --stat testdata/seed/small || {
            echo "testdata/seed/small differs from what tools/seed generates: run make seed-small and commit"; exit 1; }
      - run: make seed-check

  # Every integration test (Go integration tag, pytest integration marker)
  # against real PostgreSQL 16, Redis and the Pub/Sub emulator started as
  # plain processes by make up-native, instead of testcontainers
  # (docs/local-native.md).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-stack
      - run: make up-native
      - run: make integration-native
      - name: Native stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-native-logs
          path: |
            deploy/local/.run/logs
            deploy/local/.run/integration-report.txt
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: make down-native
