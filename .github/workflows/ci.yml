name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
      - run: make fmt-check vet
      - run: make test
      - run: make wasm-check
      - name: Fuzz smoke test
        run: make fuzz FUZZTIME=15s

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/crdt/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The same pinned versions as the Makefile, so regeneration is exact.
      - run: make proto-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint, format and breaking changes
        run: make proto-check PROTO_BASE=origin/${{ github.base_ref || 'main' }}
      - name: Generated code matches the contracts
        run: make proto-stale
      - name: Python bindings install and import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -e 'gen/python[test]'
          /tmp/venv/bin/pytest gen/python

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: sh -n deploy/compose/pubsub-init.sh
