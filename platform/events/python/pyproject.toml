[project]
name = "skein-events"
version = "0.1.0"
description = "Skein's event transport for Python services: Pub/Sub, Redis Streams and in-memory backends with one behaviour (platform/events, ADR-0022)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# No required dependencies: each backend's client library is an extra and
# is imported only when that backend is opened.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
pubsub = ["google-cloud-pubsub>=2.23"]
dev = ["pytest>=8.0", "ruff>=0.6", "fakeredis[lua]>=2.30", "redis>=5.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skein_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs a running Redis (SKEIN_TEST_REDIS_URL) or Pub/Sub emulator (SKEIN_TEST_PUBSUB_EMULATOR_HOST); skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N818: errors are named like Go's sentinels (ErrUnknownTopic -> UnknownTopic).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# A Markdown table of variables reads better unwrapped.
"src/skein_events/config.py" = ["E501"]
