# Loki (pinned in deploy/compose/docker-compose.yml) as the local log store:
# one process, filesystem storage, no auth. Logs arrive from the collector as
# OTLP at /otlp. Loki turns resource attributes such as service.name into
# index labels (service_name) and keeps trace_id, span_id and log attributes
# (request_id, user.id) as structured metadata. Those can be filtered on but
# do not create streams, so per-request values never blow up the index.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Needed for OTLP ingestion: trace_id, span_id and attributes go here.
  allow_structured_metadata: true
  # Lets Grafana's Logs Drilldown show volumes and the detected level.
  volume_enabled: true
  discover_log_levels: true
  # A week is enough for local debugging and keeps the volume small.
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
