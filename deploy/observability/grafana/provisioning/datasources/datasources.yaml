# Grafana data sources for the local stack. The UIDs are fixed because the
# dashboards in ../../dashboards refer to them; renaming one breaks every
# panel that uses it.
#
# The three sources are cross-linked so an investigation can move between
# signals without copying IDs:
#   metric exemplar  -> trace     (Prometheus exemplarTraceIdDestinations)
#   log line         -> trace     (Loki derived field on trace_id metadata)
#   span             -> its logs  (Jaeger tracesToLogsV2)
# `$$` is Grafana's escape for a literal `$` in provisioning files.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Matches the SDK export interval, so $__rate_interval covers at
      # least four samples.
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
