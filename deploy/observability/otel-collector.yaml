# OpenTelemetry Collector for the local stack (contrib distribution, pinned in
# deploy/compose/docker-compose.yml). Every service sends OTLP here and nowhere
# else, so swapping backends (Jaeger -> Cloud Trace, Prometheus -> Cloud
# Monitoring, Loki -> Cloud Logging) is a change to this file only. The GKE
# variant is otel-collector.gke.yaml; docs/observability.md explains both.
#
# Pipeline order matters: memory_limiter must be first so it can refuse data
# before anything else allocates; resource and transform run before batch so a
# batch never mixes redacted and unredacted data; batch is last before export.

extensions:
  health_check:
    # Polled by the compose healthcheck (see the healthcheck-tools service).
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    # Percentages of the container's cgroup memory limit, so the limiter
    # follows the compose resource limit instead of a duplicated number.
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  resource:
    attributes:
      # The collector runs per environment, so it can supply the environment
      # when a service forgot to. `insert` never overwrites a service's value.
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert

  transform/normalize_resource:
    error_mode: ignore
    # Semantic conventions 1.27 renamed deployment.environment to
    # deployment.environment.name. Older SDKs and copied examples still send
    # the old key; normalising here keeps one label in every backend.
    trace_statements: &normalize_environment
      - context: resource
        statements:
          - set(attributes["deployment.environment.name"], attributes["deployment.environment"]) where attributes["deployment.environment.name"] == nil and attributes["deployment.environment"] != nil
          - delete_key(attributes, "deployment.environment")
    metric_statements: *normalize_environment
    log_statements: *normalize_environment

  transform/redact:
    error_mode: ignore
    # Drops any attribute whose last dot-separated segment names a credential:
    # password, passwd, secret, token, authorization, cookie, credential(s) or
    # api key, alone or joined with `_`/`-` (refresh_token, x-api-key,
    # http.request.header.authorization, set-cookie). Matching only the last
    # segment, and only whole words, keeps legitimate keys such as
    # skein.agent.token.type and gen_ai.usage.input_tokens.
    # `[.]` instead of `\.` avoids backslash escaping inside OTTL strings.
    # deploy/observability/smoke checks this end to end.
    trace_statements:
      - context: resource
        statements: &redact_attributes
          - delete_matching_keys(attributes, "(?i)(^|[.])([a-z0-9_-]*[_-])?(password|passwd|secret|token|authorization|cookie|credentials?|api[_-]?key)([_-][a-z0-9_-]*)?$")
      - context: span
        statements: *redact_attributes
      - context: spanevent
        statements: *redact_attributes
    metric_statements:
      - context: resource
        statements: *redact_attributes
      - context: datapoint
        statements: *redact_attributes
    log_statements:
      - context: resource
        statements: *redact_attributes
      - context: log
        statements: *redact_attributes

  batch:
    # Short timeout so a developer sees their request in Jaeger within a
    # second or two; size is the default.
    timeout: 1s
    send_batch_size: 8192

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics are pushed with remote write rather than exposed for scraping by
  # the `prometheus` exporter. Reasons, in order:
  # 1. Same shape as the cloud: on GKE the collector also pushes (to Cloud
  #    Monitoring), so the only per-environment difference is the exporter.
  # 2. No second sampling step: samples keep the SDK's own timestamps instead
  #    of being re-sampled at Prometheus' scrape interval.
  # 3. The collector stays stateless: the `prometheus` exporter must hold
  #    every series in memory until it expires, which makes cardinality
  #    mistakes a collector memory problem.
  # The cost is one Prometheus flag (--web.enable-remote-write-receiver).
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    # Resource attributes are not copied onto every series: service.name
    # becomes `job`, service.instance.id becomes `instance`, and the rest go
    # to `target_info`, which dashboards join when they need service.version.
    resource_to_telemetry_conversion:
      enabled: false

  # Loki 3 ingests OTLP natively at /otlp; resource attributes such as
  # service.name become index labels (service_name) and log attributes,
  # trace_id and span_id become structured metadata.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        # Scraped by Prometheus (job otel-collector) for the collector's own
        # health: refused, dropped and exported item counts.
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/normalize_resource, transform/redact, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/normalize_resource, transform/redact, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/normalize_resource, transform/redact, batch]
      exporters: [otlp_http/loki]
