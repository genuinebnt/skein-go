# Jaeger v2 (pinned in deploy/compose/docker-compose.yml) as the local trace
# backend. Jaeger v2 is itself an OpenTelemetry Collector build, so this file
# has the same shape as otel-collector.yaml. It only receives OTLP from the
# Skein collector; services never talk to Jaeger directly.
#
# Storage is in memory: traces vanish on restart, which is what a local stack
# wants. max_traces bounds memory under the compose limit; at a few KiB per
# trace, 50 000 traces stay well under it.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: memory_store
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 50000

  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
