[project]
name = "skein-ml"
version = "0.1.0"
description = "Skein ml service: embeddings, vector search, discovery and clustering, with from-scratch NumPy algorithms benchmarked against reference libraries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.28",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.optional-dependencies]
# Each adapter's client library is optional so the core image and the unit
# tests stay small; the adapter imports it lazily and says what to install.
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
pubsub = ["google-cloud-pubsub>=2.23"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19"]
# Reference implementations for the benchmark harness only.
bench = ["scikit-learn>=1.5", "scipy>=1.13", "faiss-cpu>=1.16", "hnswlib>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "fakeredis>=2.23", "grpcio-tools>=1.66"]

[project.scripts]
skein-ml = "skein_ml.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skein_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# _gen holds the generated gRPC stubs until gen/python lands (scripts/gen_proto.sh).
pythonpath = ["src", "_gen"]
addopts = "-ra -m 'not integration and not onnx'"
markers = [
    "integration: needs Docker or a running Postgres/Redis/Pub/Sub; skipped by default",
    "onnx: needs a local ONNX sentence-transformer model in SKEIN_ONNX_MODEL_DIR; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N803/N806: single capital letters (X, B, N) follow the papers' notation.
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]
