[project]
name = "skein-ml"
version = "0.1.0"
description = "Skein ml service: embeddings, vector search, discovery and clustering, with from-scratch NumPy algorithms benchmarked against reference libraries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # The generated messages and stubs, from the repository by path (pip via
    # hatch's {root} formatting, uv via tool.uv.sources); never from PyPI.
    "skein-proto @ {root:parent:parent:uri}/gen/python",
    # The event transport shared with the agent (platform/events/python).
    "skein-events @ {root:parent:parent:uri}/platform/events/python",
    "numpy>=2.0",
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "protobuf>=7.35.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.optional-dependencies]
# Each adapter's client library is optional so the core image and the unit
# tests stay small; the adapter imports it lazily and says what to install.
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
pubsub = ["google-cloud-pubsub>=2.23"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19"]
# Reference implementations for the benchmark harness only.
bench = ["scikit-learn>=1.5", "scipy>=1.13", "faiss-cpu>=1.16", "hnswlib>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "fakeredis>=2.23"]

[project.scripts]
skein-ml = "skein_ml.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
skein-proto = { path = "../../gen/python", editable = true }
skein-events = { path = "../../platform/events/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/skein_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration and not onnx and not loopback'"
markers = [
    "integration: needs Docker or a running Postgres/Redis/Pub/Sub; skipped by default",
    "onnx: needs a local ONNX sentence-transformer model in SKEIN_ONNX_MODEL_DIR; skipped by default",
    "loopback: opens a 127.0.0.1 socket (docs/testing.md keeps sockets out of unit tests); run with -m loopback",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N803/N806: single capital letters (X, B, N) follow the papers' notation.
# SIM905: a split string literal keeps the stop-word list readable.
# N818: error classes mirror gRPC status names (NotFound, InvalidArgument), sentinel style.
# RUF200: ruff cannot parse Hatch's {root:...} context formatting in the local
# gen/python dependency, which Hatch itself resolves correctly.
ignore = ["N803", "N806", "N818", "RUF001", "RUF002", "RUF003", "RUF200", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# A Markdown table of variables reads better unwrapped.
"src/skein_ml/config.py" = ["E501"]
